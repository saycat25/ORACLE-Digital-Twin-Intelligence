services:
  api:
    build:
      context: ./backend
    environment:
      ORACLE_ENV: ${ORACLE_ENV:-development}
      ORACLE_API_KEYS: ${ORACLE_API_KEYS:-}
      DATABASE_URL: postgresql+psycopg://oracle:oracle_dev_only@db:5432/oracle
      API_PREFIX: /api/v1
      CORS_ORIGINS: http://localhost:5173
      AI_DATA_SHARING_ENABLED: ${AI_DATA_SHARING_ENABLED:-false}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 3s
      retries: 5
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: oracle
      POSTGRES_USER: oracle
      POSTGRES_PASSWORD: oracle_dev_only
    volumes:
      - oracle_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oracle -d oracle"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  oracle_pgdata:
