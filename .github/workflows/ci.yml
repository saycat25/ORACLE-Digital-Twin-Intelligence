name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: alembic upgrade head
      - run: pytest
      - name: Generate CycloneDX SBOM
        run: |
          pip install cyclonedx-bom
          cyclonedx-py environment --sv 1.6 --of JSON -o ../oracle-backend-sbom.cdx.json
      - name: Upload backend SBOM
        uses: actions/upload-artifact@v4
        with:
          name: oracle-backend-sbom
          path: oracle-backend-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm audit --audit-level=high
      - run: npm run build

  operations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate operational scripts
        run: bash -n scripts/backup-postgres.sh scripts/restore-postgres.sh
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r <(python -c "import tomllib; p=tomllib.load(open('backend/pyproject.toml','rb')); print('\\n'.join(p['project']['dependencies']))")
        shell: bash
